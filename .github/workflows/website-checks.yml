name: Website checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Use HTTPS Ubuntu package mirror
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          # The runner's HTTP Azure mirror can stall large font downloads.
          for folder in [Path('/etc/apt/sources.list.d'), Path('/etc/apt')]:
              for source in folder.glob('*.sources' if folder.name == 'sources.list.d' else 'sources.list'):
                  text = source.read_text()
                  text = text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  text = text.replace('http://security.ubuntu.com/ubuntu', 'https://security.ubuntu.com/ubuntu')
                  source.write_text(text)
          PY
      - run: npx playwright install --with-deps --only-shell chromium
      - run: python3 tests/check_html.py
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-test-results
          path: test-results/
          retention-days: 7
